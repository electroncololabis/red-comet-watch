[project]
name = "hguc-price-watch"
version = "0.1.0"
description = "本地闲鱼 HGUC 价格追踪与战情网页"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hguc_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
